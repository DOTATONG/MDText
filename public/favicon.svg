<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fffcfa"/>
      <stop offset="1" stop-color="#fbece1"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b87f"/>
      <stop offset="1" stop-color="#e8893f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5792a"/>
      <stop offset="1" stop-color="#a84300"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#e8890a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#3a1a05" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-25%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- paper stack: back sheet -->
  <path d="M232 192 L692 192 L856 356 L856 896 L232 896 Z" fill="#f6c9a4" opacity="0.5" filter="url(#soft)"/>

  <!-- main sheet with folded top-right corner -->
  <g filter="url(#shadow)">
    <path d="M200 160 L660 160 L824 324 L824 864 L200 864 Z" fill="url(#paper)" stroke="#c2540a" stroke-opacity="0.22" stroke-width="6"/>
    <!-- folded corner -->
    <path d="M660 160 L824 324 L660 324 Z" fill="url(#fold)"/>
    <path d="M660 160 L824 324" stroke="#ffffff" stroke-width="6" opacity="0.7"/>

    <!-- MD wordmark -->
    <g transform="translate(332 396)" fill="url(#ink)">
      <path d="M0 168 L0 0 L49 0 L84 101 L119 0 L168 0 L168 168 L129 168 L129 74 L91 168 L77 168 L39 74 L39 168 Z"/>
      <path fill-rule="evenodd" transform="translate(202 0)" d="M0 0 L74 0 C130 0 158 38 158 84 C158 130 130 168 74 168 L0 168 Z M41 39 L70 39 C103 39 117 58 117 84 C117 110 103 129 70 129 L41 129 Z"/>
    </g>

    <!-- text lines -->
    <rect x="272" y="630" width="390" height="32" rx="16" fill="#c2540a" opacity="0.82"/>
    <rect x="272" y="698" width="330" height="32" rx="16" fill="#c2540a" opacity="0.62"/>
    <rect x="272" y="766" width="430" height="32" rx="16" fill="#c2540a" opacity="0.72"/>

    <!-- text cursor -->
    <rect x="690" y="620" width="26" height="52" rx="8" fill="url(#accent)"/>
  </g>
</svg>
